<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Profile — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="appNav"></nav>
  <main class="page">
    <div id="alert" class="alert"></div>
    <div id="profileRoot"><div class="loading">Loading profile...</div></div>
  </main>
  <div class="modal-bg" id="swapModal">
    <div class="modal">
      <h3>Request a skill swap</h3>
      <p class="page-sub">Offer one of your skills and ask for one of theirs.</p>
      <form id="swapForm">
        <div class="form-group">
          <label>Skill you offer</label>
          <select id="skillOffered" required></select>
        </div>
        <div class="form-group">
          <label>Skill you want</label>
          <select id="skillWanted" required></select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="swapMessage" rows="3" placeholder="Say why this swap is a good fit"></textarea>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary" type="submit" id="swapSubmit">Send request</button>
          <button class="btn btn-secondary" type="button" id="swapCancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
