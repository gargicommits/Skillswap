<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Contact — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="appNav"></nav>
  <main class="page">
    <h1 class="page-title">Contact</h1>
    <div id="alert" class="alert"></div>
    <form class="card" id="contactForm" style="max-width:520px">
      <div class="form-group"><label>Name</label><input name="name" required></div>
      <div class="form-group"><label>Email</label><input name="email" type="email" required></div>
      <div class="form-group"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
      <button class="btn btn-primary" type="submit" id="cbtn">Send</button>
    </form>
  </main>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('cbtn');
      btn.disabled = true;
      try {
        const form = e.target;
        const data = await api.post('/api/contact', {
          name: form.name.value, email: form.email.value, message: form.message.value
        });
        showAlert(document.getElementById('alert'), data.message, 'ok');
        form.reset();
      } catch (err) {
        showAlert(document.getElementById('alert'), err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
