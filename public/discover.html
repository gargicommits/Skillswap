<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="appNav"></nav>
  <main class="page">
    <h1 class="page-title">Discover people</h1>
    <p class="page-sub">Search by skill or name, then filter until you find the right match.</p>
    <div class="filters card" style="padding:16px">
      <input id="search" placeholder="Search for a skill or person..." />
      <select id="category">
        <option value="">All categories</option>
        <option>Technology</option>
        <option>Design</option>
        <option>Business</option>
        <option>Creative</option>
      </select>
      <select id="skill"><option value="">All skills</option></select>
      <select id="rating">
        <option value="">Any rating</option>
        <option value="4">4.0+</option>
        <option value="4.5">4.5+</option>
        <option value="4.8">4.8+</option>
      </select>
      <input id="location" placeholder="Location" />
    </div>
    <div id="results" class="grid-auto"><div class="loading">Loading people...</div></div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/discover.js"></script>
</body>
</html>
