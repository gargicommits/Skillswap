<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Discover — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="appNav"></nav>
  <main class="page">
    <h1 class="page-title">Find a study partner</h1>
    <p class="page-sub">Meet students sharing SPPU First Year Engineering subjects from Semesters 1 and 2.</p>
    <div class="filters card" style="padding:16px">
      <input id="search" placeholder="Search a subject or student..." />
      <select id="category">
        <option value="">All subjects</option>
        <option>Semester 1</option>
        <option>Semester 2</option>
      </select>
      <select id="skill"><option value="">All subjects</option></select>
      <select id="rating">
        <option value="">Any rating</option>
        <option value="4">4.0+</option>
        <option value="4.5">4.5+</option>
        <option value="4.8">4.8+</option>
      </select>
      <input id="location" placeholder="Location" />
    </div>
    <div id="results" class="grid-auto"><div class="loading">Loading people...</div></div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/discover.js"></script>
</body>
</html>
