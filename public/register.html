<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Sign Up — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="appNav"></nav>
  <div class="auth-wrap">
    <div class="auth-panel">
      <div class="auth-card">
        <h1 class="page-title">Create your profile</h1>
        <p class="page-sub">Verified students start with 100 Skill Credits.</p>
        <div id="alert" class="alert"></div>
        <form id="registerForm">
          <div class="form-group">
            <label for="name">Full name</label>
            <input id="name" name="name" required placeholder="e.g. Anchal Singh" />
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" required minlength="3" placeholder="e.g. anchal" />
          </div>
          <div class="form-group">
            <label for="erpId">ERP / Student ID (Optional for verification)</label>
            <input id="erpId" name="erpId" placeholder="e.g. ERP202605" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="name@college.edu or name@skillswap.dev" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters" />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6" placeholder="Repeat your password" />
          </div>
          <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%">Create Verified Account</button>
        </form>
        <p style="margin-top:16px;color:var(--muted)">Already have an account? <a href="/login.html">Log in</a></p>
      </div>
    </div>
    <aside class="auth-side">
      <h2>Teach what you know. Learn what you don’t.</h2>
      <p>Join Anchal, Gargi, Shreya, Shravani and the community of peer learners swapping skills with ERP verification.</p>
    </aside>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
